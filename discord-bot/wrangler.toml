name = "val-shop-wishlist"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
GITHUB_REPO = "lukeyeh4/val-shop-checker"
SITE_URL = "https://lukeyeh4.github.io/val-shop-checker/"  # serves skins.json (pictures, autocomplete)

# Secrets (set with `npx wrangler secret put NAME`, not here):
#   DISCORD_PUBLIC_KEY  Discord app -> General Information -> Public Key
#   DISCORD_USER_ID     your Discord user ID (only you can use the command)
#   GITHUB_TOKEN        fine-grained token, this repo only, Contents: read and write
